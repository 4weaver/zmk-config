zero_arg_behaviors: [caps_word, scroll_enc, bootloader, studio_unlock, sys_reset, soft_off]
raw:
  header: |-
    /*
     * Eyelash Sofle — QWERTY, GASC home-row mods.
     *
     * 64 matrix positions:
     *   Rows 0–3: 6 left + hat + 6 right = 13
     *   Row 4:    encoder, 5 left thumbs, hat click, 5 right thumbs = 12
     *
     * Thumbs, left outer→inner, then right inner→outer:
     *   spare, spare, Esc, Space/Nav, Tab/Tmux
     *   Enter/Sym, Backspace/Num, Del/Fun, Eyelash 1, Eyelash 2
     *
     * TMUX layer (hold Tab): every action is the Ctrl-b prefix plus a key —
     * H/J/K/L panes (prefix+arrows), Y split right, I new tab, B zoom, N/M next/previous tab.
     * Hold home-row D while on TMUX, or hold D then Tab, for TMUX_S
     * (Y split down, I close pane). Base D+Tab tap remains Shift+Tab.
     *
     * Clipboard macros send Ctrl, matching the previous Lily58 keymap.
     */

    #include <behaviors.dtsi>
    #include <behaviors/mouse_keys.dtsi>
    #include <dt-bindings/zmk/keys.h>
    #include <dt-bindings/zmk/bt.h>
    #include <dt-bindings/zmk/outputs.h>
    #include <dt-bindings/zmk/pointing.h>
    #include <dt-bindings/zmk/rgb.h>
  defines: common
  overrides: common
  root_nodes:
    - |-
      scroll_enc: scroll_enc {
          compatible = "zmk,behavior-sensor-rotate";
          #sensor-binding-cells = <0>;
          bindings = <&msc SCRL_UP>, <&msc SCRL_DOWN>;
      };
  behavior_nodes: []
  macro_nodes: []
