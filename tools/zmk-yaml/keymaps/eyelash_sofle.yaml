# eyelash_sofle.yaml — SOURCE for config/eyelash_sofle.keymap (generate: deno run -A gen.ts keymaps/eyelash_sofle.yaml out/eyelash_sofle.keymap)
# Shared macros/behaviors/aliases live in common.yaml (imported below).
#
# PHYSICAL GRID (64 matrix positions, listed in matrix order)
#   rows : num / upper / home / lower (13 keys each) + thumb (12 keys)
#   each row = { L: [6 keys, outer -> inner], mid: [centre hat key], R: [6 keys, inner -> outer] }
#   thumb row: L = [enc, th-l5 .. th-l1]  (enc = encoder click, outermost left)
#              R = [th-r1 .. th-r5]       (only 5 keys, R6 slot does not exist)
#   mid = 4-way hat/joystick in the centre column: hat-up/down/left/right on the
#         num/upper/home/lower rows, hat-click on the thumb row.
#
# COORDINATE NAMES (primary key into 'positions'): the key the BASE layer has at that
#   spot (tap key of hold-taps), lowercased: letters q w e ..., digits 1..0, symbols
#   `  -  =  ;  '  ,  .  /  \  and tab / lshift / lctrl for the outer column.
#   Non-base-derived: hat-* (hat), enc (encoder click), th-l1..th-l5 / th-r1..th-r5 (thumbs,
#   numbered inner -> outer on BOTH hands: th-l1/th-r1 are nearest the centre).
#   NOTE: the base layer has ',' at the lower-middle (3rd) left spot and no ',' on the
#   right half, so the right lower row is  b n m . / \  (comma is "lost" there).
#
# POSITION NAMES  <row>-<column>:  row = num|upper|home|lower|thumb
#   column = pinky|ring|middle|index|inner (inner = extra index-reach column, next to the hat)
#   outermost column on each half = far-<row>-pinky  (e.g. far-upper-pinky = Tab / '=')
#   The same position name exists on both hands; hand is L/R (C = centre hat).
#   thumb-1 = innermost thumb ... thumb-5 = outermost.  Unique key is the coordinate name.
#
# BINDING NOTATION
#   A, N1.. , LS(A), LA(LBKT)   -> &kp ...             trans / none  -> &trans / &none
#   mo(NAV) to(BASE)            -> &mo U_NAV / &to U_BASE   (layer names, U_<NAME> in the .keymap)
#   mt(LGUI,A) lt(NAV,SPACE)    -> user hold-taps (hold_taps table; hold arg first, tap arg second)
#   macro:<name> morph:<name> dance:<name> -> &<name> (macros / mod_morphs / tap_dances tables)
#   U_UND ...                   -> #define alias (aliases table, verbatim name)
#   bootloader, studio_unlock.. -> zero-arg behaviors (zero_arg_behaviors list)
#   anything else name(a,b)     -> &name a b
#
# FORMATTING (so that gen.ts reproduces the original file byte-for-byte)
#   blank_before: true     on a macro / hold-tap / mod-morph / tap-dance = blank line before it
#   fmt.banner_width       total width of the "/* ── Title ──── */" banner lines
#   fmt.layer_rows.<LAYER> one pattern per bindings row; every "_" is one binding, the spaces
#                          between them are copied verbatim (column alignment, extra gap at the hat).
#                          Edit a cell in 'layers' and the row layout is kept; if a layer's cell
#                          count changes (or the layer has no pattern) gen.ts falls back to
#                          auto-aligned columns.

import: common.yaml

meta:
  board: eyelash_sofle
  source: "config/eyelash_sofle.keymap"
  origin_main: "88f22c3"
  matrix_positions: 64
  generated_by: parse.ts
layout:
  num:   {L: ["`",    "1",   "2",   "3",   "4",   "5"  ],  mid: [hat-up   ],  R: ["6",   "7",   "8",   "9",   "0",   "-"]}
  upper: {L: [tab,    q,     w,     e,     r,     t    ],  mid: [hat-down ],  R: ["y",   u,     i,     o,     p,     "="]}
  home:  {L: [lshift, a,     s,     d,     f,     g    ],  mid: [hat-left ],  R: [h,     j,     k,     l,     ";",   "'"]}
  lower: {L: [lctrl,  z,     x,     ",",   c,     v    ],  mid: [hat-right],  R: [b,     "n",   m,     ".",   "/",   "\\"]}
  thumb: {L: [enc,    th-l5, th-l4, th-l3, th-l2, th-l1],  mid: [hat-click],  R: [th-r1, th-r2, th-r3, th-r4, th-r5]}
positions:
  "`":         {pos: far-num-pinky,    hand: L, finger: pinky,    row: num,    col: L1,   matrix: 0}
  "1":         {pos: num-pinky,        hand: L, finger: pinky,    row: num,    col: L2,   matrix: 1}
  "2":         {pos: num-ring,         hand: L, finger: ring,     row: num,    col: L3,   matrix: 2}
  "3":         {pos: num-middle,       hand: L, finger: middle,   row: num,    col: L4,   matrix: 3}
  "4":         {pos: num-index,        hand: L, finger: index,    row: num,    col: L5,   matrix: 4}
  "5":         {pos: num-inner,        hand: L, finger: index,    row: num,    col: L6,   matrix: 5}
  hat-up:      {pos: hat-up,           hand: C, finger: hat,      row: num,    col: hat,  matrix: 6}
  "6":         {pos: num-inner,        hand: R, finger: index,    row: num,    col: R1,   matrix: 7}
  "7":         {pos: num-index,        hand: R, finger: index,    row: num,    col: R2,   matrix: 8}
  "8":         {pos: num-middle,       hand: R, finger: middle,   row: num,    col: R3,   matrix: 9}
  "9":         {pos: num-ring,         hand: R, finger: ring,     row: num,    col: R4,   matrix: 10}
  "0":         {pos: num-pinky,        hand: R, finger: pinky,    row: num,    col: R5,   matrix: 11}
  "-":         {pos: far-num-pinky,    hand: R, finger: pinky,    row: num,    col: R6,   matrix: 12}
  tab:         {pos: far-upper-pinky,  hand: L, finger: pinky,    row: upper,  col: L1,   matrix: 13}
  q:           {pos: upper-pinky,      hand: L, finger: pinky,    row: upper,  col: L2,   matrix: 14}
  w:           {pos: upper-ring,       hand: L, finger: ring,     row: upper,  col: L3,   matrix: 15}
  e:           {pos: upper-middle,     hand: L, finger: middle,   row: upper,  col: L4,   matrix: 16}
  r:           {pos: upper-index,      hand: L, finger: index,    row: upper,  col: L5,   matrix: 17}
  t:           {pos: upper-inner,      hand: L, finger: index,    row: upper,  col: L6,   matrix: 18}
  hat-down:    {pos: hat-down,         hand: C, finger: hat,      row: upper,  col: hat,  matrix: 19}
  "y":         {pos: upper-inner,      hand: R, finger: index,    row: upper,  col: R1,   matrix: 20}
  u:           {pos: upper-index,      hand: R, finger: index,    row: upper,  col: R2,   matrix: 21}
  i:           {pos: upper-middle,     hand: R, finger: middle,   row: upper,  col: R3,   matrix: 22}
  o:           {pos: upper-ring,       hand: R, finger: ring,     row: upper,  col: R4,   matrix: 23}
  p:           {pos: upper-pinky,      hand: R, finger: pinky,    row: upper,  col: R5,   matrix: 24}
  "=":         {pos: far-upper-pinky,  hand: R, finger: pinky,    row: upper,  col: R6,   matrix: 25}
  lshift:      {pos: far-home-pinky,   hand: L, finger: pinky,    row: home,   col: L1,   matrix: 26}
  a:           {pos: home-pinky,       hand: L, finger: pinky,    row: home,   col: L2,   matrix: 27}
  s:           {pos: home-ring,        hand: L, finger: ring,     row: home,   col: L3,   matrix: 28}
  d:           {pos: home-middle,      hand: L, finger: middle,   row: home,   col: L4,   matrix: 29}
  f:           {pos: home-index,       hand: L, finger: index,    row: home,   col: L5,   matrix: 30}
  g:           {pos: home-inner,       hand: L, finger: index,    row: home,   col: L6,   matrix: 31}
  hat-left:    {pos: hat-left,         hand: C, finger: hat,      row: home,   col: hat,  matrix: 32}
  h:           {pos: home-inner,       hand: R, finger: index,    row: home,   col: R1,   matrix: 33}
  j:           {pos: home-index,       hand: R, finger: index,    row: home,   col: R2,   matrix: 34}
  k:           {pos: home-middle,      hand: R, finger: middle,   row: home,   col: R3,   matrix: 35}
  l:           {pos: home-ring,        hand: R, finger: ring,     row: home,   col: R4,   matrix: 36}
  ";":         {pos: home-pinky,       hand: R, finger: pinky,    row: home,   col: R5,   matrix: 37}
  "'":         {pos: far-home-pinky,   hand: R, finger: pinky,    row: home,   col: R6,   matrix: 38}
  lctrl:       {pos: far-lower-pinky,  hand: L, finger: pinky,    row: lower,  col: L1,   matrix: 39}
  z:           {pos: lower-pinky,      hand: L, finger: pinky,    row: lower,  col: L2,   matrix: 40}
  x:           {pos: lower-ring,       hand: L, finger: ring,     row: lower,  col: L3,   matrix: 41}
  ",":         {pos: lower-middle,     hand: L, finger: middle,   row: lower,  col: L4,   matrix: 42}
  c:           {pos: lower-index,      hand: L, finger: index,    row: lower,  col: L5,   matrix: 43}
  v:           {pos: lower-inner,      hand: L, finger: index,    row: lower,  col: L6,   matrix: 44}
  hat-right:   {pos: hat-right,        hand: C, finger: hat,      row: lower,  col: hat,  matrix: 45}
  b:           {pos: lower-inner,      hand: R, finger: index,    row: lower,  col: R1,   matrix: 46}
  "n":         {pos: lower-index,      hand: R, finger: index,    row: lower,  col: R2,   matrix: 47}
  m:           {pos: lower-middle,     hand: R, finger: middle,   row: lower,  col: R3,   matrix: 48}
  ".":         {pos: lower-ring,       hand: R, finger: ring,     row: lower,  col: R4,   matrix: 49}
  "/":         {pos: lower-pinky,      hand: R, finger: pinky,    row: lower,  col: R5,   matrix: 50}
  "\\":        {pos: far-lower-pinky,  hand: R, finger: pinky,    row: lower,  col: R6,   matrix: 51}
  enc:         {pos: encoder-click,    hand: L, finger: encoder,  row: thumb,  col: L1,   matrix: 52}
  th-l5:       {pos: thumb-5,          hand: L, finger: thumb,    row: thumb,  col: L2,   matrix: 53}
  th-l4:       {pos: thumb-4,          hand: L, finger: thumb,    row: thumb,  col: L3,   matrix: 54}
  th-l3:       {pos: thumb-3,          hand: L, finger: thumb,    row: thumb,  col: L4,   matrix: 55}
  th-l2:       {pos: thumb-2,          hand: L, finger: thumb,    row: thumb,  col: L5,   matrix: 56}
  th-l1:       {pos: thumb-1,          hand: L, finger: thumb,    row: thumb,  col: L6,   matrix: 57}
  hat-click:   {pos: hat-click,        hand: C, finger: hat,      row: thumb,  col: hat,  matrix: 58}
  th-r1:       {pos: thumb-1,          hand: R, finger: thumb,    row: thumb,  col: R1,   matrix: 59}
  th-r2:       {pos: thumb-2,          hand: R, finger: thumb,    row: thumb,  col: R2,   matrix: 60}
  th-r3:       {pos: thumb-3,          hand: R, finger: thumb,    row: thumb,  col: R3,   matrix: 61}
  th-r4:       {pos: thumb-4,          hand: R, finger: thumb,    row: thumb,  col: R4,   matrix: 62}
  th-r5:       {pos: thumb-5,          hand: R, finger: thumb,    row: thumb,  col: R5,   matrix: 63}
layers:
  BASE:
    index: 0
    display_name: Base
    comments: ["BASE — QWERTY, GASC on the home row."]
    sensor: ["inc_dec_kp(C_VOL_UP,C_VOL_DN)"]
    rows:
      num:   {L: [GRAVE,  N1,           N2,           N3,            N4,              N5              ],  mid: [UP   ],  R: [N6,            N7,             N8,            N9,           N0,                 MINUS]}
      upper: {L: [TAB,    Q,            W,            E,             R,               T               ],  mid: [DOWN ],  R: ["Y",           U,              I,             O,            P,                  EQUAL]}
      home:  {L: [LSHFT,  "mt(LGUI,A)", "mt(LALT,S)", "mt(LSHFT,D)", "mt(LCTRL,F)",   G               ],  mid: [LEFT ],  R: [H,             "mt(RCTRL,J)",  "mt(RSHFT,K)", "mt(RALT,L)", "mt(RGUI,SEMI)",    SQT]}
      lower: {L: [LCTRL,  Z,            X,            COMMA,         C,               V               ],  mid: [RIGHT],  R: [B,             "N",            M,             DOT,          "lt(BUTTON,SLASH)", BSLH]}
      thumb: {L: [C_MUTE, none,         none,         ESC,           "lt(NAV,SPACE)", morph:u_tmux_tab],  mid: [none ],  R: ["lt(SYM,RET)", "lt(NUM,BSPC)", "lt(FUN,DEL)", mo(EYE1),     mo(EYE2)]}
  TAP:
    index: 1
    display_name: Tap
    comments: ["TAP — same QWERTY letters, no hold-taps. Double-tap Esc returns to Base."]
    sensor: ["inc_dec_kp(C_VOL_UP,C_VOL_DN)"]
    rows:
      num:   {L: [GRAVE,  N1,   N2,   N3,                  N4,    N5 ],  mid: [UP   ],  R: [N6,  N7,   N8,  N9,   N0,    MINUS]}
      upper: {L: [TAB,    Q,    W,    E,                   R,     T  ],  mid: [DOWN ],  R: ["Y", U,    I,   O,    P,     EQUAL]}
      home:  {L: [LSHFT,  A,    S,    D,                   F,     G  ],  mid: [LEFT ],  R: [H,   J,    K,   L,    SEMI,  SQT]}
      lower: {L: [LCTRL,  Z,    X,    COMMA,               C,     V  ],  mid: [RIGHT],  R: [B,   "N",  M,   DOT,  SLASH, BSLH]}
      thumb: {L: [C_MUTE, none, none, dance:u_esc_to_base, SPACE, TAB],  mid: [none ],  R: [RET, BSPC, DEL, none, none]}
  BUTTON:
    index: 2
    display_name: Button
    comments: ["BUTTON — clipboard and mouse buttons. Thumbs fall through to Base."]
    sensor: ["inc_dec_kp(C_VOL_UP,C_VOL_DN)"]
    rows:
      num:   {L: [none,  none,  none,  none,  none,  none ],  mid: [trans],  R: [none,  none,  none,  none,  none,  none]}
      upper: {L: [none,  U_UND, U_CUT, U_CPY, U_PST, U_RDO],  mid: [trans],  R: [U_RDO, U_PST, U_CPY, U_CUT, U_UND, none]}
      home:  {L: [none,  LGUI,  LALT,  LSHFT, LCTRL, none ],  mid: [trans],  R: [none,  RCTRL, RSHFT, RALT,  RGUI,  none]}
      lower: {L: [none,  U_UND, U_CUT, U_CPY, U_PST, U_RDO],  mid: [trans],  R: [U_RDO, U_PST, U_CPY, U_CUT, U_UND, none]}
      thumb: {L: [trans, trans, trans, trans, trans, trans],  mid: [trans],  R: [trans, trans, trans, trans, trans]}
  NAV:
    index: 3
    display_name: Nav
    comments: ["NAV — hold Space."]
    sensor: ["inc_dec_kp(C_VOL_UP,C_VOL_DN)"]
    rows:
      num:   {L: [trans, trans, trans, trans, trans, trans],  mid: [trans],  R: [dance:u_to_U_TAP, morph:u_caps_word, none,          none,  none,  none]}
      upper: {L: [trans, trans, trans, trans, trans, trans],  mid: [trans],  R: [none,             LBKT,              RBKT,          none,  none,  trans]}
      home:  {L: [trans, trans, trans, trans, trans, trans],  mid: [trans],  R: [LEFT,             morph:u_down_pg,   morph:u_up_pg, RIGHT, none,  none]}
      lower: {L: [trans, trans, trans, trans, trans, trans],  mid: [trans],  R: [HOME,             PG_UP,             PG_DN,         END,   trans, trans]}
      thumb: {L: [trans, trans, trans, trans, trans, trans],  mid: [trans],  R: [trans,            trans,             trans,         trans, trans]}
  MOUSE:
    index: 4
    display_name: Mouse
    comments: [MOUSE]
    sensor: [scroll_enc]
    rows:
      num:   {L: [none,  none,       none,             none,             none,               none ],  mid: [mmv(MOVE_UP)   ],  R: [none,  none,   none,   none,   none,   none]}
      upper: {L: [none,  bootloader, dance:u_to_U_TAP, none,             dance:u_to_U_BASE,  none ],  mid: [mmv(MOVE_DOWN) ],  R: [U_RDO, U_PST,  U_CPY,  U_CUT,  U_UND,  none]}
      home:  {L: [none,  LGUI,       LALT,             LSHFT,            LCTRL,              none ],  mid: [mmv(MOVE_LEFT) ],  R: [none,  U_MS_L, U_MS_D, U_MS_U, U_MS_R, none]}
      lower: {L: [none,  none,       RALT,             dance:u_to_U_SYM, dance:u_to_U_MOUSE, none ],  mid: [mmv(MOVE_RIGHT)],  R: [none,  U_WH_L, U_WH_D, U_WH_U, U_WH_R, none]}
      thumb: {L: [trans, trans,      trans,            trans,            trans,              trans],  mid: [trans          ],  R: [trans, trans,  trans,  trans,  trans]}
  MEDIA:
    index: 5
    display_name: Media
    comments: ["MEDIA — Bluetooth, output, studio unlock."]
    sensor: ["inc_dec_kp(C_VOL_UP,C_VOL_DN)"]
    rows:
      num:   {L: [none,  studio_unlock, none,             none,             none,               none ],  mid: [trans],  R: [none,            none,             none,             none,             none,             none]}
      upper: {L: [none,  bootloader,    dance:u_to_U_TAP, none,             dance:u_to_U_BASE,  none ],  mid: [trans],  R: [none,            none,             none,             none,             none,             none]}
      home:  {L: [none,  LGUI,          LALT,             LSHFT,            LCTRL,              none ],  mid: [trans],  R: [none,            C_PREV,           C_VOL_DN,         C_VOL_UP,         C_NEXT,           none]}
      lower: {L: [none,  none,          RALT,             dance:u_to_U_FUN, dance:u_to_U_MEDIA, none ],  mid: [trans],  R: [morph:u_out_tog, morph:u_bt_sel_0, morph:u_bt_sel_1, morph:u_bt_sel_2, morph:u_bt_sel_3, none]}
      thumb: {L: [trans, trans,         trans,            trans,            trans,              trans],  mid: [trans],  R: [trans,           trans,            trans,            trans,            trans]}
  NUM:
    index: 6
    display_name: Num
    comments: [NUM]
    sensor: ["inc_dec_kp(C_VOL_UP,C_VOL_DN)"]
    rows:
      num:   {L: [none,  none,  none,  none,  none,  none ],  mid: [trans],  R: [none,  none,              none,             none,             none,       none]}
      upper: {L: [none,  ASTRK, N7,    N8,    N9,    MINUS],  mid: [trans],  R: [none,  dance:u_to_U_BASE, none,             dance:u_to_U_TAP, bootloader, none]}
      home:  {L: [none,  SLASH, N4,    N5,    N6,    EQUAL],  mid: [trans],  R: [none,  RCTRL,             RSHFT,            RALT,             RGUI,       none]}
      lower: {L: [none,  N0,    N1,    N2,    N3,    DOT  ],  mid: [trans],  R: [none,  dance:u_to_U_NUM,  dance:u_to_U_NAV, RALT,             none,       none]}
      thumb: {L: [trans, trans, trans, trans, trans, trans],  mid: [trans],  R: [trans, trans,             trans,            trans,            trans]}
  SYM:
    index: 7
    display_name: Sym
    comments: [SYM]
    sensor: ["inc_dec_kp(C_VOL_UP,C_VOL_DN)"]
    rows:
      num:   {L: [none,  none,  none,  none,  none,  none ],  mid: [trans],  R: [trans, trans, trans, trans, trans, trans]}
      upper: {L: [trans, RPAR,  AMPS,  none,  BSLH,  LPAR ],  mid: [trans],  R: [trans, trans, trans, trans, trans, trans]}
      home:  {L: [trans, CARET, HASH,  none,  SQT,   DLLR ],  mid: [trans],  R: [trans, trans, trans, trans, trans, trans]}
      lower: {L: [trans, PRCNT, AT,    none,  GRAVE, EXCL ],  mid: [trans],  R: [trans, trans, trans, trans, trans, trans]}
      thumb: {L: [trans, trans, trans, trans, trans, trans],  mid: [trans],  R: [trans, trans, trans, trans, trans]}
  FUN:
    index: 8
    display_name: Fun
    comments: ["FUN — the previous function layer, held on Delete."]
    sensor: ["inc_dec_kp(C_VOL_UP,C_VOL_DN)"]
    rows:
      num:   {L: [bootloader, none,  none,  none,  none,  none       ],  mid: [trans],  R: [none,  none,              none,               none,             none,       none]}
      upper: {L: [none,       F12,   F7,    F8,    F9,    PSCRN      ],  mid: [trans],  R: [none,  dance:u_to_U_BASE, none,               dance:u_to_U_TAP, bootloader, none]}
      home:  {L: [none,       F11,   F4,    F5,    F6,    SLCK       ],  mid: [trans],  R: [none,  RCTRL,             RSHFT,              RALT,             RGUI,       none]}
      lower: {L: [none,       F10,   F1,    F2,    F3,    PAUSE_BREAK],  mid: [trans],  R: [none,  dance:u_to_U_FUN,  dance:u_to_U_MEDIA, RALT,             none,       none]}
      thumb: {L: [trans,      trans, trans, trans, trans, trans      ],  mid: [trans],  R: [trans, trans,             trans,              trans,            trans]}
  WM:
    index: 9
    display_name: WM
    comments: ["WM — AeroSpace. No key opens this layer yet."]
    sensor: ["inc_dec_kp(C_VOL_UP,C_VOL_DN)"]
    rows:
      num:   {L: [none,  none,      none,   none,   none,   none     ],  mid: [trans],  R: [none,  none,    none,             none,      none,  none]}
