# lily58.yaml — SOURCE for config/lily58.keymap (generate: deno run -A gen.ts keymaps/lily58.yaml out/lily58.keymap)
# Shared macros/behaviors/aliases live in common.yaml (imported below).
#
# PHYSICAL GRID (58 matrix positions, listed in matrix order; the Silakka54 has 54 keys)
#   rows : num / upper / home (12 keys each) + lower (14) + thumb (8)
#   each row = { L: [6 keys, outer -> inner], mid: [...], R: [6 keys, inner -> outer] }
#   mid  = the matrix slots between the halves that are NOT fitted on the Silakka54 (always
#          &none on every layer): 2 on the lower row (nofit-lower-l/r) and the innermost thumb
#          on each side (th-l1 / th-r1). Rows num/upper/home have no mid.
#   thumb row: L = [th-l4, th-l3, th-l2] (Esc, Space/Nav, Tab/Tmux), mid = [th-l1, th-r1],
#              R = [th-r2, th-r3, th-r4]  (Enter/Sym, Backspace/Num, Del/Fun)
#   No hat, no encoder, no Eyelash layers on this board.
#
# COORDINATE NAMES (primary key into 'positions'): the key the BASE layer has at that
#   spot (tap key of hold-taps), lowercased - the SAME names as eyelash_sofle.yaml, so
#   h / j / k / l / y / i / b / n / m mean the same key on both boards:
#   letters q w e ..., digits 1..0, symbols `  -  =  ;  '  ,  .  /  \  and tab / lshift / lctrl
#   for the outer column.  Thumbs are th-l<k>/th-r<k> numbered inner -> outer (physical
#   position, so Tab/Tmux is th-l2 here but th-l1 on the Sofle, which has 5 thumbs).
#   NOTE: the base layer has ',' at the lower-middle (3rd) left spot and no ',' on the
#   right half, so the right lower row is  b n m . / \  (comma is "lost" there).
#
# POSITION NAMES  <row>-<column>:  row = num|upper|home|lower|thumb
#   column = pinky|ring|middle|index|inner;  outermost column on each half = far-<row>-pinky
#   The same position name exists on both hands; hand is L/R.  Unique key is the coordinate name.
#   thumb-1 = innermost thumb ... thumb-4 = outermost.
#
# BINDING NOTATION
#   A, N1.. , LS(A), LA(LBKT)   -> &kp ...             trans / none  -> &trans / &none
#   mo(NAV) to(BASE)            -> &mo U_NAV / &to U_BASE   (layer names, U_<NAME> in the .keymap)
#   mt(LGUI,A) lt(NAV,SPACE)    -> user hold-taps (hold_taps table; hold arg first, tap arg second)
#   macro:<name> morph:<name> dance:<name> -> &<name> (macros / mod_morphs / tap_dances tables)
#   U_UND ...                   -> #define alias (aliases table, verbatim name)
#   bootloader, studio_unlock.. -> zero-arg behaviors (zero_arg_behaviors list)
#   anything else name(a,b)     -> &name a b
#
# FORMATTING (so that gen.ts reproduces the original file byte-for-byte)
#   blank_before: true     on a macro / hold-tap / mod-morph / tap-dance = blank line before it
#   fmt.banner_width       total width of the "/* ── Title ──── */" banner lines
#   fmt.layer_rows.<LAYER> one pattern per bindings row; every "_" is one binding, the spaces
#                          between them are copied verbatim (column alignment, extra gap at the hat).
#                          Edit a cell in 'layers' and the row layout is kept; if a layer's cell
#                          count changes (or the layer has no pattern) gen.ts falls back to
#                          auto-aligned columns.

import: common.yaml

meta:
  board: lily58
  source: "config/lily58.keymap"
  origin_main: "88f22c3"
  matrix_positions: 58
  generated_by: parse.ts
layout:
  num:   {L: ["`",    "1",   "2",   "3", "4", "5"],  R: ["6",   "7",   "8",   "9", "0", "-"]}
  upper: {L: [tab,    q,     w,     e,   r,   t  ],  R: ["y",   u,     i,     o,   p,   "="]}
  home:  {L: [lshift, a,     s,     d,   f,   g  ],  R: [h,     j,     k,     l,   ";", "'"]}
  lower: {L: [lctrl,  z,     x,     ",", c,   v  ],  mid: [nofit-lower-l, nofit-lower-r],  R: [b,     "n",   m,     ".", "/", "\\"]}
  thumb: {L: [th-l4,  th-l3, th-l2],  mid: [th-l1,         th-r1        ],  R: [th-r2, th-r3, th-r4]}
positions:
  "`":         {pos: far-num-pinky,    hand: L, finger: pinky,    row: num,    col: L1,   matrix: 0}
  "1":         {pos: num-pinky,        hand: L, finger: pinky,    row: num,    col: L2,   matrix: 1}
  "2":         {pos: num-ring,         hand: L, finger: ring,     row: num,    col: L3,   matrix: 2}
  "3":         {pos: num-middle,       hand: L, finger: middle,   row: num,    col: L4,   matrix: 3}
  "4":         {pos: num-index,        hand: L, finger: index,    row: num,    col: L5,   matrix: 4}
  "5":         {pos: num-inner,        hand: L, finger: index,    row: num,    col: L6,   matrix: 5}
  "6":         {pos: num-inner,        hand: R, finger: index,    row: num,    col: R1,   matrix: 6}
  "7":         {pos: num-index,        hand: R, finger: index,    row: num,    col: R2,   matrix: 7}
  "8":         {pos: num-middle,       hand: R, finger: middle,   row: num,    col: R3,   matrix: 8}
  "9":         {pos: num-ring,         hand: R, finger: ring,     row: num,    col: R4,   matrix: 9}
  "0":         {pos: num-pinky,        hand: R, finger: pinky,    row: num,    col: R5,   matrix: 10}
  "-":         {pos: far-num-pinky,    hand: R, finger: pinky,    row: num,    col: R6,   matrix: 11}
  tab:         {pos: far-upper-pinky,  hand: L, finger: pinky,    row: upper,  col: L1,   matrix: 12}
  q:           {pos: upper-pinky,      hand: L, finger: pinky,    row: upper,  col: L2,   matrix: 13}
  w:           {pos: upper-ring,       hand: L, finger: ring,     row: upper,  col: L3,   matrix: 14}
  e:           {pos: upper-middle,     hand: L, finger: middle,   row: upper,  col: L4,   matrix: 15}
  r:           {pos: upper-index,      hand: L, finger: index,    row: upper,  col: L5,   matrix: 16}
  t:           {pos: upper-inner,      hand: L, finger: index,    row: upper,  col: L6,   matrix: 17}
  "y":         {pos: upper-inner,      hand: R, finger: index,    row: upper,  col: R1,   matrix: 18}
  u:           {pos: upper-index,      hand: R, finger: index,    row: upper,  col: R2,   matrix: 19}
  i:           {pos: upper-middle,     hand: R, finger: middle,   row: upper,  col: R3,   matrix: 20}
  o:           {pos: upper-ring,       hand: R, finger: ring,     row: upper,  col: R4,   matrix: 21}
  p:           {pos: upper-pinky,      hand: R, finger: pinky,    row: upper,  col: R5,   matrix: 22}
  "=":         {pos: far-upper-pinky,  hand: R, finger: pinky,    row: upper,  col: R6,   matrix: 23}
  lshift:      {pos: far-home-pinky,   hand: L, finger: pinky,    row: home,   col: L1,   matrix: 24}
  a:           {pos: home-pinky,       hand: L, finger: pinky,    row: home,   col: L2,   matrix: 25}
  s:           {pos: home-ring,        hand: L, finger: ring,     row: home,   col: L3,   matrix: 26}
  d:           {pos: home-middle,      hand: L, finger: middle,   row: home,   col: L4,   matrix: 27}
  f:           {pos: home-index,       hand: L, finger: index,    row: home,   col: L5,   matrix: 28}
  g:           {pos: home-inner,       hand: L, finger: index,    row: home,   col: L6,   matrix: 29}
  h:           {pos: home-inner,       hand: R, finger: index,    row: home,   col: R1,   matrix: 30}
  j:           {pos: home-index,       hand: R, finger: index,    row: home,   col: R2,   matrix: 31}
  k:           {pos: home-middle,      hand: R, finger: middle,   row: home,   col: R3,   matrix: 32}
  l:           {pos: home-ring,        hand: R, finger: ring,     row: home,   col: R4,   matrix: 33}
  ";":         {pos: home-pinky,       hand: R, finger: pinky,    row: home,   col: R5,   matrix: 34}
  "'":         {pos: far-home-pinky,   hand: R, finger: pinky,    row: home,   col: R6,   matrix: 35}
  lctrl:       {pos: far-lower-pinky,  hand: L, finger: pinky,    row: lower,  col: L1,   matrix: 36}
  z:           {pos: lower-pinky,      hand: L, finger: pinky,    row: lower,  col: L2,   matrix: 37}
  x:           {pos: lower-ring,       hand: L, finger: ring,     row: lower,  col: L3,   matrix: 38}
  ",":         {pos: lower-middle,     hand: L, finger: middle,   row: lower,  col: L4,   matrix: 39}
  c:           {pos: lower-index,      hand: L, finger: index,    row: lower,  col: L5,   matrix: 40}
  v:           {pos: lower-inner,      hand: L, finger: index,    row: lower,  col: L6,   matrix: 41}
  nofit-lower-l: {pos: nofit-lower-l,    hand: L, finger: inner,    row: lower,  col: M1,   matrix: 42, unfitted: true}
  nofit-lower-r: {pos: nofit-lower-r,    hand: R, finger: inner,    row: lower,  col: M2,   matrix: 43, unfitted: true}
  b:           {pos: lower-inner,      hand: R, finger: index,    row: lower,  col: R1,   matrix: 44}
  "n":         {pos: lower-index,      hand: R, finger: index,    row: lower,  col: R2,   matrix: 45}
  m:           {pos: lower-middle,     hand: R, finger: middle,   row: lower,  col: R3,   matrix: 46}
  ".":         {pos: lower-ring,       hand: R, finger: ring,     row: lower,  col: R4,   matrix: 47}
  "/":         {pos: lower-pinky,      hand: R, finger: pinky,    row: lower,  col: R5,   matrix: 48}
  "\\":        {pos: far-lower-pinky,  hand: R, finger: pinky,    row: lower,  col: R6,   matrix: 49}
  th-l4:       {pos: thumb-4,          hand: L, finger: thumb,    row: thumb,  col: L1,   matrix: 50}
  th-l3:       {pos: thumb-3,          hand: L, finger: thumb,    row: thumb,  col: L2,   matrix: 51}
  th-l2:       {pos: thumb-2,          hand: L, finger: thumb,    row: thumb,  col: L3,   matrix: 52}
