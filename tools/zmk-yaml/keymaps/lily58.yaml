      upper: {L: [TAB,                 Q,     W,   E,     R,  T ],  R: ["Y", U,    I,   O,   P,     EQUAL]}
      home:  {L: [LSHFT,               A,     S,   D,     F,  G ],  R: [H,   J,    K,   L,   SEMI,  SQT]}
