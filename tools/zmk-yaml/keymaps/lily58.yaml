    rows:
      num:   {L: [trans, trans, trans, trans,      trans, trans],  R: [none,                 none,               none,              none,                none, none]}
      upper: {L: [trans, trans, trans, trans,      trans, trans],  R: [macro:tm_split_right, none,               macro:tm_new_tab,  none,                none, none]}
