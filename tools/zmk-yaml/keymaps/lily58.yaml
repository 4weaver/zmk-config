    index: 0
    display_name: Base
    comments: ["BASE — QWERTY, GASC on the home row."]
    rows:
      num:   {L: [GRAVE, N1,              N2,               N3,            N4,            N5],  R: [N6,            N7,             N8,            N9,           N0,                 MINUS]}
      upper: {L: [TAB,   Q,               W,                E,             R,             T ],  R: ["Y",           U,              I,             O,            P,                  EQUAL]}
      home:  {L: [LSHFT, "mt(LGUI,A)",    "mt(LALT,S)",     "mt(LSHFT,D)", "mt(LCTRL,F)", G ],  R: [H,             "mt(RCTRL,J)",  "mt(RSHFT,K)", "mt(RALT,L)", "mt(RGUI,SEMI)",    SQT]}
      lower: {L: [LCTRL, Z,               X,                COMMA,         C,             V ],  mid: [none, none],  R: [B,             "N",            M,             DOT,          "lt(BUTTON,SLASH)", BSLH]}
      thumb: {L: [ESC,   "lt(NAV,SPACE)", morph:u_tmux_tab],  mid: [none, none],  R: ["lt(SYM,RET)", "lt(NUM,BSPC)", "lt(FUN,DEL)"]}
