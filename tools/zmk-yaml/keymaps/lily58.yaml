    rows:
      num:   {L: [none,  none,      none,   none,   none,   none     ],  R: [none,  none,    none,             none,      none,  none]}
      upper: {L: [none,  LA(LBKT),  LA(N7), LA(N8), LA(N9), LA(RBKT) ],  R: [none,  LA(DOT), LA(N0),           LA(MINUS), none,  none]}
      home:  {L: [none,  LA(SEMI),  LA(N4), LA(N5), LA(N6), LA(EQUAL)],  R: [none,  LA(H),   LA(J),            LA(K),     LA(L), none]}
      lower: {L: [none,  LA(GRAVE), LA(N1), LA(N2), LA(N3), LA(BSLH) ],  mid: [none, none],  R: [none,  LA(ESC), dance:u_to_U_NAV, RALT,      none,  none]}
      thumb: {L: [trans, trans,     trans ],  mid: [none, none],  R: [trans, trans,   trans]}
